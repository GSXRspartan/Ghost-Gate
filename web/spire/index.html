<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ghost Gate — The Buried Spire</title>

    <!--
      The Buried Spire — Ghost Gate's reused dungeon crawler.

      Engine: Buried Spire Quest (github.com/albader94/maze-game-html), MIT licensed,
      upstream commit 51c928c29b286b3d885493cb724b3af3417e9e06. LICENSE and
      UPSTREAM_README.md in this directory carry the preserved copyright notice.

      Differences from upstream, all in the spirit of Ghost Gate's rules:
        * the Firebase leaderboard (three CDN scripts, its service, its CSP allowances)
          and the PWA service worker are removed: nothing here phones home, and a cached
          game must never be served over a live one,
        * the page is integrated with the Ghost Gate site: a gate banner carries the
          policy the bridge serves, and spire/ghostgate.js (loaded LAST) reads only that
          banner plus the game's own public state — never keys, never proof material,
          nothing the browser could use to claim access.
    -->

    <link rel="stylesheet" href="spire/spire.css">
    <link rel="stylesheet" href="spire/ghostgate.css">
</head>
<body>
    <div id="ghostgate-banner">
        <a class="gg-home" href="/">← Ghost Gate</a>
        <span id="gg-gate-line">loading gate…</span>
        <span id="gg-session-line"></span>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <canvas id="minimap"></canvas>

        <!-- Game UI (upstream ids, untouched) -->
        <div id="ui">
            <div>Floor: <span id="floor">-1</span></div>
            <div>Light: <span id="lightTime">100</span>%</div>
            <div class="light-bar">
                <div class="light-fill" id="lightBar"></div>
            </div>
            <div>Orbs: <span id="orbs">0</span></div>
            <div>Checkpoint: <span id="checkpoint">1</span></div>
            <div id="powerStatus"></div>
        </div>

        <!-- Inventory -->
        <div id="inventory">
            <div class="inventory-slot" id="slot1" data-key="1"></div>
            <div class="inventory-slot" id="slot2" data-key="2"></div>
            <div class="inventory-slot" id="slot3" data-key="3"></div>
        </div>

        <!-- Story/Message Display -->
        <div id="story"></div>
    </div>

    <script src="spire/config.js"></script>
    <script src="spire/messages.js"></script>
    <script src="spire/utils.js"></script>
    <script src="spire/soundManager.js"></script>
    <script src="spire/gameState.js"></script>
    <script src="spire/tutorial.js"></script>
    <script src="spire/input.js"></script>
    <script src="spire/mapGenerator.js"></script>
    <script src="spire/entities.js"></script>
    <script src="spire/inventory.js"></script>
    <script src="spire/renderer.js"></script>
    <script src="spire/gameLogic.js"></script>
    <script src="spire/storyNarration.js"></script>
    <script src="spire/main.js"></script>
    <!-- Ghost Gate's shim: last, so it sees the finished game object. -->
    <script src="spire/ghostgate.js"></script>
</body>
</html>
