[workspace]
resolver = "2"
members = [
    "crates/ghost-gate-core",
    "crates/ghost-gate-cbor",
    "crates/ghost-gate-registry",
    "crates/ghost-gate-admin",
    "crates/ghost-gate-verifier",
    "crates/ghost-gate-wallet",
    "crates/ghost-gate-bridge",
    "crates/ghost-gate-minotari",
    "crates/ghost-gate-ggbp1-spike",
    "crates/ghost-gate-tests",
    "crates/ghost-gate-walletd",
    "crates/ghost-gate-telegram",
]
# The template is its own workspace: it builds for wasm32-unknown-unknown with a
# different feature set and must not join the native build graph.
exclude = [
    "templates/ghost_gate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Ghost Gate contributors"]

[workspace.dependencies]
# The Tari Ootle v0.42.0 cohort (tag v0.42.0, commit
# a43773e600b9503ed3fadcd3f0048f86131e3644), pinned to a local COPY of that tree rather than the
# clone itself, because crates/template_builtin/build.rs compiles builtin templates and writes the
# .wasm output into its own crate tree. Building in place would modify the pinned reference, which
# this project treats as read-only. See docs/GATE0_RESULTS.md and scripts/prepare_reference.sh.
#
# COHORT SWITCH
#   ../_ootle-v042-build        pristine v0.42.0
#   ../_ootle-v042-ghost-gate   the same tree plus docs/wallet-mvp.patch (selected)
#
# The patched cohort is selected because Gate 3 has to put a statement built by the *wallet* in front
# of the *engine*, and the two must be the same compilation of the same crates: cargo treats
# tari_ootle_wallet_sdk built from one path and from another as two distinct packages, so a statement
# produced by the patched wallet would not type-check as an argument to an engine from the pristine
# tree. Switching cohorts is a one-line search-and-replace over this block; nothing else in the repo
# hardcodes the choice.
#
# Nothing outside the wallet changes between the two, so running the engine-backed suite against the
# patched cohort is also a check that the patch does not perturb consensus. See
# docs/GATE3_RESULTS.md.
#
# Each pin also carries the crates.io version the v0.42.0 workspace declares, so a reader can see the
# cohort without reading the reference.
tari_template_lib = { path = "../_ootle-v042-ghost-gate/crates/template_lib", version = "0.33.0" }
tari_template_lib_types = { path = "../_ootle-v042-ghost-gate/crates/template_lib_types", version = "0.33.0", default-features = false }
tari_template_abi = { path = "../_ootle-v042-ghost-gate/crates/template_abi", version = "0.20.1", default-features = false }
tari_template_test_tooling = { path = "../_ootle-v042-ghost-gate/crates/template_test_tooling", version = "0.42.0" }
tari_engine = { path = "../_ootle-v042-ghost-gate/crates/engine", version = "0.42.0" }
tari_engine_types = { path = "../_ootle-v042-ghost-gate/crates/engine_types", version = "0.42.0" }
tari_ootle_transaction = { path = "../_ootle-v042-ghost-gate/crates/transaction", version = "0.42.0", features = ["serde"] }
tari_ootle_wallet_crypto = { path = "../_ootle-v042-ghost-gate/crates/wallet/crypto", version = "0.44" }
tari_ootle_wallet_sdk = { path = "../_ootle-v042-ghost-gate/crates/wallet/sdk", version = "0.44.0" }
tari_ootle_wallet_storage_sqlite = { path = "../_ootle-v042-ghost-gate/crates/wallet/storage_sqlite", version = "0.44.0" }
tari_ootle_walletd_client = { path = "../_ootle-v042-ghost-gate/clients/wallet_daemon_client", version = "0.44.0" }
tari_ootle_common_types = { path = "../_ootle-v042-ghost-gate/crates/common_types", version = "0.42.0" }
tari_ootle_address = { path = "../_ootle-v042-ghost-gate/crates/ootle_address", version = "0.12" }
tari_indexer_client = { path = "../_ootle-v042-ghost-gate/clients/tari_indexer_client", version = "0.43", default-features = false }
tari_consensus_types = { path = "../_ootle-v042-ghost-gate/crates/consensus_types", version = "0.42.0" }
tari_bor = { path = "../_ootle-v042-ghost-gate/crates/tari_bor", version = "0.16.2", default-features = false }
ootle_byte_type = { path = "../_ootle-v042-ghost-gate/crates/ootle_byte_type", version = "0.14" }
# Crate is `ootle-network` (hyphenated package name, `ootle_network` lib name).
ootle-network = { path = "../_ootle-v042-ghost-gate/crates/ootle_network", version = "0.2" }
ootle_serde = { path = "../_ootle-v042-ghost-gate/crates/ootle_serde", version = "0.6", default-features = false }
# Wallet SDK's spec implementations. `tari_ootle_wallet_sdk_services` supplies the default spec's
# network interface, which the SDK requires at construction; Gate 3 points it at an unused local port
# because the statement path resolves its inputs from the wallet, not the network.
tari_ootle_wallet_sdk_services = { path = "../_ootle-v042-ghost-gate/crates/wallet/sdk_services", version = "0.34.2" }

# crates.io, at the versions the v0.42.0 workspace resolves.
tari_crypto = "0.23.4"
tari_utilities = "0.10"
# crates.io, not the cohort: tari_shutdown lives in the base-layer repo, which is not part of the
# v0.42.0 tree. Same version the cohort workspace pins, so the SDK and its consumers agree.
tari_shutdown = "6.0.1-pre.2"
# Must match the minicbor the cohort uses; the derive has to agree with the one
# tari_template_lib_types derives its CBOR impls with or the wire format diverges.
minicbor = { version = "2.3", default-features = false }

anyhow = "1.0.100"
async-trait = "0.1"
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ghost-gate-registry = { path = "crates/ghost-gate-registry" }
ghost-gate-admin = { path = "crates/ghost-gate-admin" }
rand = "0.10.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
sha2 = "0.10.8"
time = { version = "0.3.47", features = ["formatting", "parsing", "macros"] }

# wasmer's Cranelift JIT is ~10x slower unoptimized, which dominates template test
# time. Mirrors the override in the Ootle workspace so engine-backed tests stay fast.
[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2

[profile.release]
overflow-checks = true
