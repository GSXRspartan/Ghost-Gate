[workspace]
# Test-only fixture. Separate workspace because it compiles to wasm32-unknown-unknown, like every
# template. Not part of the shipped Ghost Gate template and not a security component.

[package]
name = "ghost-gate-faucet"
description = "Test fixture that creates stealth outputs for Ghost Gate engine tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Ghost Gate contributors"]

[dependencies]
tari_template_lib = { path = "../../../_ootle-v0492-ghost-gate/crates/template_lib", version = "0.37.0" }

[lib]
crate-type = ["cdylib"]
