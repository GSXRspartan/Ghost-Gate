[workspace]
# The template builds for wasm32-unknown-unknown and is deliberately outside the native workspace.

[package]
name = "ghost-gate-template"
description = "Ghost Gate: consensus-enforced private threshold access proof for Tari Ootle"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Ghost Gate contributors"]

[dependencies]
tari_template_lib = { path = "../../../_ootle-v042-ghost-gate/crates/template_lib", version = "0.33.0" }
# Needed directly for `collections::BTreeMap` in component state: the prelude re-exports the map
# type only for the engine host side, not into a template's own module.
tari_template_abi = { path = "../../../_ootle-v042-ghost-gate/crates/template_abi", version = "0.20.1", default-features = false }
ghost-gate-core = { path = "../../crates/ghost-gate-core" }

[lib]
crate-type = ["cdylib"]