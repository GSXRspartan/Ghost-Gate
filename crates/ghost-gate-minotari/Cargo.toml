[package]
name = "ghost-gate-minotari"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Minotari L1 XTM threshold proving: the wallet daemon service, the bridge channel and the base-node verifier"

[features]
# A synthetic-only cryptographic feasibility spike. It is off by default and has no wallet, chain,
# HTTP, bridge, Telegram, or authorization integration.
experimental-ggbp1 = []

[dependencies]
ghost-gate-core = { path = "../ghost-gate-core" }
ghost-gate-bridge = { path = "../ghost-gate-bridge" }

# The Minotari 6.0.1-pre.2 stack, the same versions the Ootle v0.42.0 cohort pins, so both
# proof paths agree on the crypto and the wire formats.
minotari_wallet = "6.0.1-pre.2"
minotari_node_grpc_client = "6.0.1-pre.2"
tari_comms = "6.0.1-pre.2"
tari_comms_dht = "6.0.1-pre.2"
tari_p2p = "6.0.1-pre.2"
tari_common = "6.0.1-pre.2"
tari_common_sqlite = "6.0.1-pre.2"
tari_common_types = "6.0.1-pre.2"
tari_transaction_components = "6.0.1-pre.2"
tari_transaction_key_manager = "6.0.1-pre.2"
tari_crypto = "0.23.4"
tari_utilities = "0.10"
tari_script = "6.0.1-pre.2"
tari_shutdown = "6.0.1-pre.2"

anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
tokio.workspace = true
sha2.workspace = true
hmac = "0.12.1"
time.workspace = true
# The proof service's loopback HTTP server and the bridge's client side.
reqwest = { version = "0.12", features = ["json"] }
# The same tonic the minotari_app_grpc 6.0.1-pre.2 stack resolves.
tonic = "0.13.1"

[dev-dependencies]
# An in-process base node for the end-to-end tests. It compiles the whole node stack, which is
# why it is a dev-dependency: the shipped library and binary never pull it in.
minotari_node = "6.0.1-pre.2"
minotari_app_grpc = "6.0.1-pre.2"
tari_template_lib_types = { workspace = true, features = ["std"] }
env_logger = "0.11"
log = "0.4"
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ghost-gate-minotari-wallet"
path = "src/bin/ghost-gate-minotari-wallet.rs"
