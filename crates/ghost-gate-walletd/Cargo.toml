[package]
name = "ghost-gate-walletd"
description = "The real walletd channel for the Ghost Gate bridge, and the bridge process that composes it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ghost-gate-core = { path = "../ghost-gate-core" }
ghost-gate-registry = { path = "../ghost-gate-registry" }
ghost-gate-bridge = { path = "../ghost-gate-bridge" }
# The native Minotari L1 channels (the proof wallet service client and the base node reader).
ghost-gate-minotari = { path = "../ghost-gate-minotari" }
# The cohort's own client, pinned in the workspace like every other cohort crate. This is the crate the
# localnet scenario drives directly, so the adapter speaks the same JSON-RPC surface the evidence was
# gathered against rather than a re-description of it.
tari_ootle_walletd_client = { workspace = true }
# Chain reads for the bridge's credential mode: the relying site must fetch the proof output
# itself, never accept it from the page.
# `client` gates the REST surface; the indexer types alone are not enough to read substates.
tari_indexer_client = { workspace = true, features = ["client"] }
tari_engine_types = { workspace = true }
# `transaction_builder()` and `UnsignedTransaction`. Needed to assemble the proof call, and the same
# types the harness uses at integration_tests/tests/steps/ghost_gate.rs:477.
tari_ootle_transaction = { workspace = true }
tari_template_lib_types = { workspace = true, features = ["std", "serde"] }
tari_ootle_wallet_sdk = { workspace = true }
hex = { workspace = true }
# The walletd client's API-key/JWT type is `Zeroizing<String>`; the same crate version the cohort uses.
zeroize = "1.8"
rand = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# Raw JSON chain reads for cohorts the pinned client cannot parse (Esmeralda runs indexer 0.47.0,
# whose REST renamed `substate` to `state`). Same reqwest line the workspace already pins.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }

[dev-dependencies]
tari_ootle_transaction = { workspace = true }

[[bin]]
name = "ghost-gate-bridge"
path = "src/bin/ghost-gate-bridge.rs"