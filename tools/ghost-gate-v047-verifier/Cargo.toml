[workspace]

[package]
name = "ghost-gate-v047-verifier"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pinned-anchor Tari Ootle v0.47 consensus proof adapter for Ghost Gate"

# This package is deliberately its own Cargo workspace. Ghost Gate's main workspace still uses
# the pinned v0.42 cohort for the existing credential verifier; mixing both type cohorts in one
# Rust dependency graph would make evidence conversion ambiguous and unsafe.
[dependencies]
ootle-network = { path = "../../.tari-v047-reference/crates/ootle_network", features = ["serde"] }
tari_engine_types = { path = "../../.tari-v047-reference/crates/engine_types" }
tari_indexer_client = { path = "../../.tari-v047-reference/clients/tari_indexer_client", default-features = false }
tari_ootle_common_types = { path = "../../.tari-v047-reference/crates/common_types" }
tari_ootle_light_client = { path = "../../.tari-v047-reference/crates/wallet/light_client", features = ["test-fixtures"] }
tari_state_tree = { path = "../../.tari-v047-reference/crates/state_tree" }
tari_template_lib_types = { path = "../../.tari-v047-reference/crates/template_lib_types" }
thiserror = "2.0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

